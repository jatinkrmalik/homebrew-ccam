name: Update formula

# Checks hourly for a new ccam release and rewrites the formula for it.
# Run it by hand right after a release: gh workflow run update.yml
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-formula

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the formula
        run: bash update.sh
      - name: Commit
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/ccam.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ccam $version"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
